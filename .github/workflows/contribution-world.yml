name: Update Contribution World

on:
  schedule:
    - cron: '20 3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/contribution-world.mjs
      - .github/workflows/contribution-world.yml

permissions:
  contents: write

concurrency:
  group: contribution-world
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate from actual contributions
        run: node scripts/contribution-world.mjs
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN }}
          GITHUB_USER: ${{ github.repository_owner }}

      - name: Save animation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/contribution-world.svg
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update contribution world'
          git pull --rebase origin main
          git push origin HEAD:main
